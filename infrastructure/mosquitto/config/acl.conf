# Eclipse Mosquitto Access Control List (ACL)

# Backend server client - Full access to all device topics
user backend_service
topic readwrite users/#
topic readwrite $SYS/#

# Pattern-based access for devices
# Each hardware node can only access its own hierarchy
pattern read users/%u/devices/%c/command
pattern write users/%u/devices/%c/state
pattern write users/%u/devices/%c/heartbeat
pattern write users/%u/devices/%c/telemetry
pattern write users/%u/devices/%c/ack
pattern write users/%u/devices/%c/events
pattern write users/%u/devices/%c/subnode

# Anonymous user for local development and initial testing
user anonymous
topic readwrite users/#
topic read $SYS/#
